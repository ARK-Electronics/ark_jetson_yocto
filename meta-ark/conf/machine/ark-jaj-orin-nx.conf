# SPDX-License-Identifier: MIT
#@TYPE: Machine
#@NAME: ARK Just a Jetson with Orin NX 16GB
#@DESCRIPTION: JAJ carrier, P3767-0000 Super configuration, QSPI boot and NVMe rootfs

require conf/machine/p3768-0000-p3767-0000.conf

# Keep NVIDIA's SKU-specific Super clocks, power model, BPMP, memory and UPHY.
# The flash helper rejects other module IDs/SKUs before writing the image.
TEGRA_FLASH_CHECK_VARS = "BOARDID BOARDSKU"
TEGRA_FLASH_CHECK_BOARDID = "3767"
TEGRA_FLASH_CHECK_BOARDSKU = "0000"

PREFERRED_PROVIDER_virtual/dtb = "ark-jaj-devicetree"
KERNEL_DEVICETREE = "tegra234-ark-jaj-p3767-0000-super.dtb"

TEGRA_FLASHVAR_PINMUX_CONFIG = "tegra234-mb1-bct-pinmux-ark-jaj.dtsi"
TEGRA_FLASHVAR_PMC_CONFIG = "tegra234-mb1-bct-padvoltage-ark-jaj.dtsi"
TEGRA_FLASHVAR_MB2BCT_CFG = "tegra234-mb2-bct-misc-ark-jaj.dts"

# The full UEFI profile prefers NVMe and leaves newly discovered network boot
# options at the end. Minimal UEFI requires its own exact "nvme" selector.
TEGRA_BOOTCONTROL_OVERLAYS:append = " ${@'' if bb.utils.to_boolean(d.getVar('TEGRA_MINIMAL_BOOT')) else 'ark_boot_order.dtbo'}"
