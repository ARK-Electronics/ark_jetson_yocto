# Optional experiment layer; loaded only by kas/fastboot.yml.
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bbappend"
BBFILE_COLLECTIONS += "ark_fastboot"
BBFILE_PATTERN_ark_fastboot = "^${LAYERDIR}/"
BBFILE_PRIORITY_ark_fastboot = "11"
LAYERVERSION_ark_fastboot = "1"
LAYERDEPENDS_ark_fastboot = "core tegra ark"
LAYERSERIES_COMPAT_ark_fastboot = "wrynose"
